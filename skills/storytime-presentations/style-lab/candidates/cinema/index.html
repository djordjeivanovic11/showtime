<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buses in Bunches</title>
<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: normal; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 700; font-style: normal; src: url(fonts/cormorant-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: italic; src: url(fonts/cormorant-garamond-latin-600-italic.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url(fonts/cormorant-garamond-latin-500-italic.woff2) format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 400; src: url(fonts/fira-sans-condensed-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 400; src: url(fonts/fira-sans-condensed-greek-400-normal.woff2) format("woff2"); unicode-range: U+0370-03FF; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 500; src: url(fonts/fira-sans-condensed-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 600; src: url(fonts/fira-sans-condensed-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url(fonts/fira-sans-condensed-latin-700-normal.woff2) format("woff2"); }

  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #030305; }
  #world { display: block; width: 1920px; height: 1080px; }
  #notes { position: absolute; left: 160px; right: 160px; bottom: 140px; padding: 28px 36px; background: rgba(5, 6, 10, 0.92); border: 2px solid #ffb347; border-radius: 6px; color: #f3e9d6; font: 500 32px/1.4 "Fira Sans Condensed", sans-serif; display: none; }
  #notes.open { display: block; }
  #notes .num { color: #ffb347; font-weight: 600; letter-spacing: 4px; font-size: 22px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="world" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Why do buses come in bunches?"></svg>
  <div id="notes"><div class="num"></div><div class="body"></div></div>
</div>
<script src="kit.js"></script>
<script src="deck.js"></script>
</body>
</html>
