<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buses in Bunches</title>
<style>
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 400; src: url(fonts/fraunces-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 600; src: url(fonts/fraunces-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 400; src: url(fonts/fraunces-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 600; src: url(fonts/fraunces-latin-600-italic.woff2) format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 400; src: url(fonts/source-serif-4-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 600; src: url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; src: url(fonts/source-serif-4-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-style: normal; font-weight: 400; src: url(fonts/source-serif-4-greek-400-normal.woff2) format("woff2"); unicode-range: U+0370-03FF; }
  @font-face { font-family: "Source Serif 4"; font-style: italic; font-weight: 400; src: url(fonts/source-serif-4-greek-400-italic.woff2) format("woff2"); unicode-range: U+0370-03FF; }
  @font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; src: url(fonts/caveat-latin-700-normal.woff2) format("woff2"); }

  :root { --paper: #F1EADB; --ink: #1C1A17; --ink-soft: #4D463E; --red: #B02E1C; --mat: #2B2723; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--mat); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--paper); }
  #art { display: block; width: 1920px; height: 1080px; }
  #notes {
    position: absolute; left: 80px; right: 80px; bottom: 90px; display: none;
    padding: 28px 36px; background: rgba(249, 245, 236, 0.97); color: var(--ink);
    border: 3px solid var(--ink); box-shadow: 10px 10px 0 rgba(28, 26, 23, 0.85);
    font: 400 32px/1.4 "Source Serif 4", Georgia, serif;
  }
  #notes b { display: block; font: 600 22px "Source Serif 4", Georgia, serif; letter-spacing: 4px; color: var(--red); margin-bottom: 8px; }
  #notes.on { display: block; }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why do buses come in bunches?"></svg>
  <div id="notes" aria-live="polite"></div>
</div>
<script src="kit.js"></script>
<script src="deck.js"></script>
</body>
</html>
