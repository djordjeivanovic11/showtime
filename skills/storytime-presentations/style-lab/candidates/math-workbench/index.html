<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Proof — Why do buses come in bunches?</title>
  <style>
    @font-face {
      font-family: Inter;
      font-weight: 400;
      src: url("fonts/inter-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Inter;
      font-weight: 700;
      src: url("fonts/inter-latin-700-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Inter Greek;
      font-weight: 400;
      src: url("fonts/inter-greek-400-normal.woff2") format("woff2");
      unicode-range: U+0370-03FF;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #202b35; font-family: Inter, "Inter Greek", sans-serif; }
    #stage {
      position: absolute;
      width: 1920px;
      height: 1080px;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      overflow: hidden;
      background: #edece5;
    }
    #stage svg { width: 1920px; height: 1080px; display: block; }
    #notes {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: min(940px, 90vw);
      padding: 18px 22px;
      background: #192b36f2;
      border-radius: 10px;
      color: #fffdf6;
      font: 20px/1.45 Inter, sans-serif;
      box-shadow: 0 15px 40px #0006;
    }
    body.show-notes #notes { display: block; }
    #motion-status {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 11;
      padding: 9px 14px;
      background: #192b36;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      opacity: 0;
      transition: opacity 300ms;
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Illustrated mathematical explanation of bus bunching"></div>
  <div id="notes" aria-live="polite"></div>
  <div id="motion-status" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="deck.js"></script>
</body>
</html>
